<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="节点质量榜：一屏比较每个节点的 1ms IPQS、Coffee、IPure 评分与出口归属">
  <title>节点质量榜 · Best IP</title>
  <link rel="stylesheet" href="./styles.css">
  <!-- 空 data: 图标：只为消掉浏览器自发请求 /favicon.ico 的 404。 -->
  <link rel="icon" href="data:,">
  <!-- 在线部署由 Worker 注入 window.BEST_IP_CONFIG（mode: "gateway"）；文件不存在时页面退回示例数据或 ?job= 深链。 -->
  <script src="./site-config.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-head">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 17.5 8.5 11l4 4L21 6"></path><path d="M15.5 6H21v5.5"></path>
            </svg>
          </span>
          <h1>节点质量榜</h1>
          <span class="tag-demo" title="本页是静态设计示例，节点与 IP 全部为合成数据，不来自真实扫描">示例数据</span>
        </div>
        <p class="run-stats" id="runStats"></p>
      </div>

      <!-- 发起扫描：只在在线部署且扫描公钥就绪时由 app/main.js 显示。订阅地址按要求明文输入，
           提交前在浏览器内加密（app/scan-crypto.js），不回显、不落盘、不进导出快照。 -->
      <form class="scanbar" id="scanForm" hidden>
        <div class="scan-row">
          <label class="sr-only" for="subscriptionUrl">Mihomo YAML 订阅链接</label>
          <div class="field">
            <svg class="field-icon" aria-hidden="true" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13.5a3.5 3.5 0 0 0 5 0l3-3a3.5 3.5 0 0 0-5-5l-1 1"></path><path d="M14 10.5a3.5 3.5 0 0 0-5 0l-3 3a3.5 3.5 0 0 0 5 5l1-1"></path>
            </svg>
            <input id="subscriptionUrl" name="subscription_url" type="text" inputmode="url" autocomplete="off" spellcheck="false" required placeholder="粘贴 Mihomo YAML 订阅链接（http 或 https 均可）">
          </div>
          <button id="startScan" type="submit" class="btn btn-primary">开始扫描</button>
          <button id="stopScan" type="button" class="btn btn-ghost" hidden>停止</button>
        </div>
        <p class="scan-progress" id="scanProgress" role="status" aria-live="polite" hidden></p>
      </form>

      <div class="toolbar">
        <div class="field field-search">
          <label class="sr-only" for="query">搜索节点</label>
          <svg class="field-icon" aria-hidden="true" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m15.5 15.5 4 4"></path>
          </svg>
          <input id="query" type="search" placeholder="搜索节点、IP、地区、服务商、ASN…" autocomplete="off" spellcheck="false" aria-keyshortcuts="/">
          <kbd class="kbd" aria-hidden="true">/</kbd>
        </div>

        <fieldset class="segmented" id="statusFilter">
          <legend class="sr-only">按状态筛选</legend>
          <label><input type="radio" name="status" value="all" checked><span>全部<b class="seg-count" data-count="all"></b></span></label>
          <label><input type="radio" name="status" value="success"><span>完整<b class="seg-count" data-count="success"></b></span></label>
          <label><input type="radio" name="status" value="partial"><span>部分<b class="seg-count" data-count="partial"></b></span></label>
          <label><input type="radio" name="status" value="failed"><span>失败<b class="seg-count" data-count="failed"></b></span></label>
        </fieldset>

        <fieldset class="toggles">
          <legend class="sr-only">按 1ms 判定筛选</legend>
          <label class="toggle" title="只看 1ms 判为住宅或移动网络的出口"><input type="checkbox" id="filterClean"><span>住宅 / 移动</span></label>
          <label class="toggle" title="只看 1ms 判为原生（注册地与归属地一致）的出口"><input type="checkbox" id="filterNative"><span>原生</span></label>
        </fieldset>

        <div class="field field-select">
          <label class="sr-only" for="sortSelect">排序</label>
          <select id="sortSelect"></select>
        </div>

        <div class="export-group" role="group" aria-label="导出离线快照">
          <button id="exportMhtml" type="button" class="btn btn-primary" title="把当前视图导出为单个 .mhtml 离线快照，双击即可打开">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"></path><path d="m7 12 5 5 5-5"></path><path d="M4 20h16"></path></svg>
            导出 .mhtml
          </button>
          <button id="exportHtml" type="button" class="btn btn-ghost" title="同样内容的自包含单文件 .html；浏览器不渲染 .mhtml 时的兜底">.html</button>
        </div>
      </div>
    </header>

    <div class="result-bar">
      <p class="result-count" aria-live="polite"><span id="resultCount"></span> <button id="clearFilters" type="button" class="link-btn" hidden>清除筛选</button></p>
      <p class="legend">
        <span class="legend-rail legend-good"></span>住宅/移动且原生
        <span class="legend-rail legend-mixed"></span>有折损
        <span class="legend-rail legend-bad"></span>失败
        <span class="sep" aria-hidden="true">·</span>点击分数打开来源报告
      </p>
    </div>

    <main class="table-wrap" id="tableWrap">
      <table class="grid" id="grid">
        <caption class="sr-only">节点质量榜：每行一个节点，按来源分组列出出口归属与 1ms、Coffee、IPure 评分</caption>
        <colgroup id="gridColumns"></colgroup>
        <thead id="gridHead"></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="emptyState" hidden>
        <p class="empty-title">没有匹配的节点</p>
        <p class="empty-desc">换个关键字，或点「清除筛选」恢复全部节点。</p>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="./app/copy.js"></script>
  <script type="module" src="./app/main.js"></script>
</body>
</html>
