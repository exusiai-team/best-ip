name: Scan subscription

run-name: Best IP scan ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Browser-generated correlation ID
        required: true
        type: string
      worker_url:
        description: Worker origin that holds the subscription for this request
        required: true
        type: string

concurrency:
  group: best-ip-scan
  cancel-in-progress: false

# id-token: write 只用来向 GitHub 要一张 OIDC 令牌，向 Worker 证明「我是 main 上 scan.yml 的这次运行」，
# 换回暂存在 Worker 的订阅地址（scripts/claim_subscription.mjs）。整条通路没有 Actions secret 以外的共享密钥。
permissions:
  contents: read
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # 精简过的准备段：
    # - 校验输入、写 IPure 配置、凭 OIDC 向 Worker 领取订阅合成一步；
    # - 不锁版本：Python 依赖按 pyproject.toml 解析最新，Mihomo 取最新 release。
    # - Python 解释器（uv 管理的 3.13）+ .venv 按天缓存：每天第一次扫描走「装 uv → uv sync」重新解析
    #   最新依赖（约 3 秒），同一天内后续扫描直接用 .venv/bin/python。
    # - Mihomo 每次取 latest（带 GITHUB_TOKEN 避免 API 限流），用 GitHub 给的资产摘要校验。
    # - WARP IPv6 出口在后台建（约 3~5 秒），与领取订阅、装 Mihomo 重叠，扫描前再等它落定。
    env:
      BEST_IP_PYTHON_DIR: /home/runner/.best-ip/python
      BEST_IP_TOOLS_DIR: /home/runner/.best-ip/bin
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Pick today's environment cache key
        id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore Python environment
        id: env-cache
        uses: actions/cache@v6
        with:
          path: |
            .venv
            /home/runner/.best-ip/python
            /home/runner/.best-ip/bin
          key: best-ip-env-${{ runner.os }}-cpython3.13-${{ hashFiles('pyproject.toml') }}-${{ steps.day.outputs.day }}

      # 托管 runner 没有 IPv6 出口：只把 ::/0 接进现注册的 Cloudflare WARP，IPv6-only 节点才连得上。
      # 在后台跑，与后面几步重叠；结果在扫描前的「Wait for IPv6 egress」里收。
      # 内联脚本而非第三方 action：这个 job 有 id-token: write。
      - name: Start IPv6 egress through Cloudflare WARP (background)
        shell: bash
        run: |
          nohup bash -c 'bash scripts/warp_ipv6.sh; echo $? > "$RUNNER_TEMP/warp.status"' \
            > "$RUNNER_TEMP/warp.log" 2>&1 &

      - name: Validate inputs and claim subscription URL
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          WORKER_URL: ${{ inputs.worker_url }}
          IPURE_CONFIG_YAML: ${{ secrets.IPURE_CONFIG_YAML }}
        shell: bash
        run: |
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9_-]{1,128}$ ]]
          [[ "$WORKER_URL" =~ ^https://[A-Za-z0-9.-]+$ ]]
          test -n "$IPURE_CONFIG_YAML"
          umask 077
          mkdir -p config
          printf '%s\n' "$IPURE_CONFIG_YAML" > config/ipure.yml
          node scripts/claim_subscription.mjs \
            --subscription-file "$RUNNER_TEMP/subscription-url" \
            --token-file "$RUNNER_TEMP/runner-token"

      - name: Set up uv
        if: steps.env-cache.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false

      # 解释器必须装进缓存目录（只用 uv 管理的那份，不用 runner 镜像自带的）：.venv/bin/python 指向它，
      # 两样一起缓存才自洽，镜像升级也不会让缓存里的 .venv 指向一个不存在的解释器。
      - name: Install Python and latest dependencies
        if: steps.env-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          UV_PYTHON=3.13 UV_PYTHON_PREFERENCE=only-managed UV_PYTHON_INSTALL_DIR="$BEST_IP_PYTHON_DIR" \
            uv sync --no-dev
          interpreter="$(readlink -f .venv/bin/python)"
          [[ "$interpreter" == "$BEST_IP_PYTHON_DIR"/* ]]

      - name: Install latest Mihomo and verify IPure configuration
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          .venv/bin/python scripts/download_mihomo.py
          .venv/bin/python -c 'from backend.app.sources.ipure_config import load_ipure_headers; headers = load_ipure_headers(); assert headers.get("cookie"), "IPure verification cookie is required"'

      # 失败不挡扫描（IPv6 节点照旧「网络不可达」）。
      # 硬上限 25 秒：WARP 只服务少数 IPv6 节点，不能让它拖住整轮扫描（曾经白等 89 秒）。
      # 超时就照常开扫，IPv6 节点本轮失败；后台脚本若稍后建好，正在跑的扫描也能用上。
      - name: Wait for IPv6 egress
        continue-on-error: true
        shell: bash
        run: |
          deadline=$((SECONDS + 25))
          until [[ -f "$RUNNER_TEMP/warp.status" ]] || (( SECONDS >= deadline )); do sleep 0.2; done
          cat "$RUNNER_TEMP/warp.log"
          [[ -f "$RUNNER_TEMP/warp.status" ]] || { echo "WARP 25 秒内未就绪，先开始扫描"; exit 1; }
          exit "$(cat "$RUNNER_TEMP/warp.status")"

      # 这一步也会把扫描进度（计数与每个节点的阶段，不含出口 IP 与评分）回报给 Worker 的
      # /api/scan-progress，与订阅中继同一个 Worker、同一张领取时拿到的 runner 令牌；回报失败不影响扫描。
      - name: Run production scan
        env:
          BEST_IP_MIHOMO_PATH: ${{ github.workspace }}/runtime/mihomo/mihomo
          # 托管 runner 只有 2~4 核，默认公式 min(16, max(8, CPU)) 落在 8 并发；节点检测几乎全是等网络，
          # 同一条 25 节点订阅 8→16 并发的墙钟实测从 50.9s/70.9s 降到 30.4s/31.2s（见 backend/app/config.py）。
          BEST_IP_MAX_PARALLEL_NODES: "16"
          BEST_IP_SUBSCRIPTION_RELAY_URL: ${{ inputs.worker_url }}/api/subscription-relay
          REQUEST_ID: ${{ inputs.request_id }}
        shell: bash
        run: >-
          BEST_IP_SUBSCRIPTION_RELAY_TOKEN="$(cat "$RUNNER_TEMP/runner-token")"
          .venv/bin/python scripts/run_scan.py
          --request-id "$REQUEST_ID"
          --subscription-file "$RUNNER_TEMP/subscription-url"
          --output-dir "$RUNNER_TEMP/action-artifact"

      - name: Upload sanitized result artifact
        uses: actions/upload-artifact@v7
        with:
          name: best-ip-result-${{ inputs.request_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/action-artifact
          if-no-files-found: error
          retention-days: 1

      - name: Remove runner secrets and workspaces
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/runner-token" "$RUNNER_TEMP/subscription-url" config/ipure.yml
          rm -rf runtime/mihomo
