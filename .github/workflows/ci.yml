name: CI

# push 只看 main：PR 分支的每次 push 已经由 pull_request 跑一遍，原来 push + pull_request
# 两个触发会让同一个 commit 跑两次 CI。同一分支连推时取消旧的那次。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          cache-python: true
          python-version: "3.13"
      # 只装 dev 组（ruff）：lint 不需要 fastapi/httpx 等运行时依赖，ruff 版本仍由 uv.lock 锁定。
      - name: Lint
        run: uv run --frozen --only-group dev ruff check .
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      # npm run check = 语法（scripts/check_js.mjs）+ 前端契约（scripts/check_frontend_contracts.mjs）
      # + MHTML 序列化往返（frontend-next/tools/mhtml-roundtrip.mjs）。新断言接在 check 里，
      # 所以只要这条在跑，CI 就自动覆盖它们，不必在这里逐条罗列。
      - name: Check JavaScript syntax, frontend contracts and mhtml roundtrip
        run: npm run check
      - name: Wrangler dry-run
        run: npm run dry-run
